
<form>
<label for="fullname">Full name</label>
<input type="text" id="fullname" name="fullname" required>
<span class="error" id="fullname-error"></span>

<label for="studentID">Student ID</label>
<input type="text" id="studentID" name="studentID" required>
<span class="error" id="studentID-error"></span>

<label for="programme">Programme</label>
<select id="programme" name="programme" required>
    <option value="">Select a programme</option>
    <option value="bsc-cs">Bsc Computer Science</option>
</select>
<span class="error" id="programme-error"></span>

<label for="courseId">Course fields</label>
<select id="courseId" name="courseId" required>
    <option value="">Select Courses:</option>
    <option value="ICT-461">ICT-461 Web Systems and Technology</option>
</select>
<span class="error" id="courseId-error"></span>

<button type="submit">Register</button>
</form>
